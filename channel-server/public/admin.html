<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel Control</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #171b22;
        --line: #272d38;
        --text: #e6e9ef;
        --muted: #949cab;
        --accent: #4ade80;
        --warn: #fbbf24;
        --bad: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 32px 20px 60px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .wrap { max-width: 860px; margin: 0 auto; }

      h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }

      .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 18px;
      }

      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        margin: 0 0 14px;
        font-weight: 600;
      }

      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      input, select {
        background: #0b0e13;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 10px 13px;
        font-size: 15px;
        font-family: inherit;
      }

      input#code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        width: 165px;
      }

      input:focus, select:focus { outline: none; border-color: var(--accent); }

      button {
        background: var(--accent);
        color: #06240f;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
        font-family: inherit;
      }

      button:hover { filter: brightness(1.08); }

      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
      }

      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }
      .on { background: var(--accent); }
      .off { background: var(--bad); }
      .idle { background: #4b5462; }

      .ch {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 15px 17px;
        margin-bottom: 11px;
        background: #12161d;
      }

      .ch:last-child { margin-bottom: 0; }

      .ch-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

      .ch-name { font-size: 16px; font-weight: 600; }

      .ch-meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

      .ch-videos { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }

      .ch-videos div {
        color: var(--muted);
        font-size: 12.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .ch-url {
        margin-top: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        color: #6b7280;
        word-break: break-all;
      }

      table { width: 100%; border-collapse: collapse; }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        font-weight: 600;
        padding: 0 0 9px;
        border-bottom: 1px solid var(--line);
      }

      td { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
      tr:last-child td { border-bottom: 0; }

      td select { padding: 6px 10px; font-size: 13px; }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0b0e13;
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 12px;
        color: var(--warn);
        letter-spacing: 0.1em;
      }

      .msg { margin-top: 12px; font-size: 13.5px; min-height: 19px; }
      .msg.ok { color: var(--accent); }
      .msg.err { color: var(--bad); }

      .empty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>Channel Control</h1>
      <div class="sub">Each channel is its own continuously-encoded HLS stream. TVs pair once, then play forever.</div>

      <div class="panel">
        <h2>Channels</h2>
        <div id="channels"></div>
      </div>

      <div class="panel">
        <h2>Pair a TV</h2>
        <div class="row">
          <input id="code" placeholder="CODE" maxlength="6" autocomplete="off" />
          <select id="pairChannel"></select>
          <button id="claim">Pair device</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>

      <div class="panel">
        <h2>Devices</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Playing</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="devices"></tbody>
        </table>
        <div class="empty" id="empty">No devices yet. Boot a TV to get a pairing code.</div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)

      let channelList = []

      function setMessage(text, kind) {
        const el = $('msg')
        el.textContent = text
        el.className = 'msg ' + (kind || '')
      }

      function duration(seconds) {
        if (seconds > 3600) {
          return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm'
        }
        return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's'
      }

      function prettyVideo(filename) {
        return filename.replace(/\.mp4$/, '').replace(/^\d+-/, '').replace(/-/g, ' ')
      }

      async function refresh() {
        try {
          const [status, devices] = await Promise.all([
            fetch('/api/status').then((r) => r.json()),
            fetch('/api/admin/devices').then((r) => r.json()),
          ])

          channelList = status.channels || []

          // -- channels ------------------------------------------------
          $('channels').innerHTML = channelList
            .map(
              (c) => `
              <div class="ch">
                <div class="ch-head">
                  <div class="ch-name"><span class="dot ${c.onAir ? 'on' : 'off'}"></span>${c.name}</div>
                  <div class="ch-meta">${c.onAir ? 'live' : 'down'} · up ${duration(c.uptimeSeconds)} · ${c.segmentsOnDisk} seg · ${c.restartCount} restarts</div>
                </div>
                <div class="ch-videos">
                  ${(c.videos || []).map((v, i) => `<div>${i + 1}. ${prettyVideo(v)}</div>`).join('') || '<div>no videos</div>'}
                </div>
                <div class="ch-url">/channels/${c.id}/live.m3u8</div>
              </div>`
            )
            .join('')

          // -- pair channel selector -----------------------------------
          const previous = $('pairChannel').value

          $('pairChannel').innerHTML = channelList
            .map((c) => `<option value="${c.id}">${c.name}</option>`)
            .join('')

          if (previous) $('pairChannel').value = previous

          // -- devices -------------------------------------------------
          const rows = devices.devices || []

          $('empty').style.display = rows.length ? 'none' : 'block'

          $('devices').innerHTML = rows
            .map((d) => {
              const state = !d.paired
                ? `<span class="dot idle"></span>waiting · <code>${d.code || '—'}</code>`
                : `<span class="dot ${d.online ? 'on' : 'idle'}"></span>${d.online ? 'online' : 'offline'}`

              const picker = d.paired
                ? `<select data-channel-for="${d.deviceId}">${channelList
                    .map(
                      (c) =>
                        `<option value="${c.id}"${c.id === d.channelId ? ' selected' : ''}>${c.name}</option>`
                    )
                    .join('')}</select>`
                : '<span style="color:#4b5462">—</span>'

              return `<tr>
                <td>${d.name || '<span style="color:#949cab">unnamed</span>'}<div style="color:#4b5462;font-size:11.5px">${d.platform || ''}</div></td>
                <td>${state}</td>
                <td>${picker}</td>
                <td style="text-align:right"><button class="ghost" data-remove="${d.deviceId}">Remove</button></td>
              </tr>`
            })
            .join('')

          document.querySelectorAll('button[data-remove]').forEach((btn) => {
            btn.onclick = async () => {
              await fetch('/api/admin/unpair', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: btn.dataset.remove }),
              })
              refresh()
            }
          })

          document.querySelectorAll('select[data-channel-for]').forEach((sel) => {
            sel.onchange = async () => {
              const response = await fetch('/api/admin/device/channel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  deviceId: sel.dataset.channelFor,
                  channelId: sel.value,
                }),
              })

              if (response.ok) {
                setMessage('Channel changed — the TV switches within 30s (its next heartbeat).', 'ok')
              } else {
                setMessage('Could not change channel.', 'err')
              }

              refresh()
            }
          })
        } catch (error) {
          setMessage('Cannot reach server: ' + error.message, 'err')
        }
      }

      $('claim').onclick = async () => {
        const code = $('code').value.trim().toUpperCase()

        if (!code) {
          setMessage('Enter the code shown on the TV.', 'err')
          return
        }

        const response = await fetch('/api/admin/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, channelId: $('pairChannel').value }),
        })

        const result = await response.json()

        if (!response.ok) {
          setMessage(result.error || 'Pairing failed.', 'err')
          return
        }

        setMessage(`Paired "${result.device.name}" — it starts playing within a few seconds.`, 'ok')

        $('code').value = ''

        refresh()
      }

      $('code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('claim').click()
      })

      refresh()
      setInterval(refresh, 3000)
    </script>
  </body>
</html>
